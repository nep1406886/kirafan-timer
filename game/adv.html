<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>白紙のエトワリア · 序章</title>
<!--
  提案 B《図書館の灯》的播放器，同时也是 core/adv.js + core/advstage.js 的验证页。
  剧本是数据（asset/story/prologue.js），这一页只负责播。
  A/C/D 三作要放剧情时用同一套，不各写一个。
-->
<link rel="preconnect" href="https://unpkg.com">
<style>
:root {
    --ink: #2b2724;
    --paper: #f7f4ee;
    --box: rgba(28, 24, 22, 0.78);
    --accent: #c8a24a;
}
* { box-sizing: border-box; }
html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #14110f; color: var(--paper);
    font-family: "Noto Sans JP", "Source Han Sans SC", "Hiragino Sans",
        "Microsoft YaHei", system-ui, sans-serif;
}
#stage {
    position: fixed; inset: 0;
    display: grid; place-items: stretch;
}
/* 背景层 / 平面立绘层 / 标题层由 core/advstage.js 建，这里只给样式 */
.adv-stage-overlay { position: absolute; inset: 0; overflow: hidden; }
.adv-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: 1;
}
.adv-bg-next { opacity: 0; }
/* 逆光：图书馆那一幕，光从窗户来，人物压暗 */
.adv-bg-backlit::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 50% 18%,
        rgba(255, 250, 235, 0.55), rgba(255, 250, 235, 0) 62%);
}
/* 过曝的白色天空 */
.adv-bg-blownout::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to bottom,
        rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.35) 55%,
        rgba(255, 255, 255, 0.08));
}
.adv-flats { position: absolute; inset: 0; pointer-events: none; }
.adv-flat {
    position: absolute; bottom: 6%; left: 50%;
    height: 62%;
    transform: translateX(calc(-50% + var(--adv-flat-x, 0) * 14vw));
    transition: opacity 400ms ease, transform 400ms ease;
}
/* 表情是叠在一起的多张图，只有一张不透明。切表情不需要重新解码，
   也就不会像换 src 那样闪一帧空白。第一张负责撑开容器宽度，
   其余的绝对定位叠上去 —— 同一个角色的所有表情尺寸相同。 */
.adv-flat img { height: 100%; width: auto; display: block; }
.adv-flat-face { transition: opacity 140ms linear; }
.adv-flat-face:not(:first-child) { position: absolute; top: 0; left: 0; }
.adv-flat-away { transform:
    translateX(calc(-50% + var(--adv-flat-x, 0) * 14vw)) scaleX(-1); }
/* 立绘还没转换完时的占位：显示名字而不是碎图，场景照样能跑 */
.adv-flat-placeholder {
    display: grid; place-items: center;
    min-width: 8rem; padding: 0.6rem 1rem;
    border: 1px dashed rgba(255, 255, 255, 0.35);
    border-radius: 0.4rem;
    background: rgba(20, 17, 15, 0.45);
    font-size: 0.95rem; letter-spacing: 0.08em;
    height: auto; bottom: 22%;
}
#canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; z-index: 2;
}
/* 标题卡 */
.adv-title {
    position: absolute; inset: 0; z-index: 5;
    display: grid; place-content: center; justify-items: center;
    gap: 0.6rem; pointer-events: none;
    opacity: 0; transition: opacity 700ms ease;
    text-shadow: 0 0.15em 0.6em rgba(0, 0, 0, 0.55);
}
.adv-title-in { opacity: 1; }
.adv-title-primary {
    font-size: clamp(1.8rem, 5.4vw, 3.4rem);
    letter-spacing: 0.18em; font-weight: 600;
}
.adv-title-secondary {
    font-size: clamp(0.85rem, 2vw, 1.15rem);
    letter-spacing: 0.28em; color: rgba(247, 244, 238, 0.72);
}
/* 章节标题比作品标题克制：它是段落记号，不是招牌 */
.adv-title-chapter .adv-title-primary {
    font-size: clamp(1.2rem, 3.4vw, 2rem); letter-spacing: 0.3em;
}
.adv-title-chapter::before {
    content: ""; position: absolute; inset: 0;
    background: rgba(10, 9, 8, 0.55); z-index: -1;
}

/* 文本框 */
#ui { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
#ui > * { pointer-events: auto; }
.adv-box {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 1.1rem clamp(1rem, 6vw, 5rem) clamp(1.1rem, 3vh, 2rem);
    background: linear-gradient(to top,
        rgba(14, 12, 11, 0.94) 30%, rgba(14, 12, 11, 0.72) 78%, transparent);
    min-height: 27vh;
    cursor: pointer;
}
.adv-name {
    display: flex; align-items: baseline; gap: 0.7rem;
    margin-bottom: 0.5rem;
}
.adv-name-primary {
    font-size: clamp(1rem, 2.6vw, 1.35rem); font-weight: 600;
    color: var(--accent); letter-spacing: 0.06em;
}
.adv-name-secondary {
    font-size: clamp(0.75rem, 1.7vw, 0.9rem);
    color: rgba(200, 162, 74, 0.72);
}
.adv-text { min-height: 4.6em; }
/* 日文在上、中文在下，跟语音对齐，中文当字幕 —— core/i18n.js 的 both 模式 */
.adv-primary {
    margin: 0 0 0.35rem; font-size: clamp(1rem, 2.5vw, 1.3rem);
    line-height: 1.75; letter-spacing: 0.02em;
}
.adv-secondary {
    margin: 0; font-size: clamp(0.82rem, 1.9vw, 1rem);
    line-height: 1.7; color: rgba(247, 244, 238, 0.7);
}
.adv-next {
    position: absolute; right: clamp(1rem, 6vw, 5rem); bottom: 0.9rem;
    font-size: 0.8rem; color: var(--accent);
    animation: nudge 1.4s ease-in-out infinite;
}
@keyframes nudge { 0%,100% { transform: translateY(0); opacity: 0.5; }
                   50% { transform: translateY(0.25em); opacity: 1; } }
.adv-choices {
    display: grid; gap: 0.55rem; margin: 0.4rem 0 0.2rem;
    max-width: 46rem;
}
.adv-choice {
    display: grid; gap: 0.15rem; text-align: left;
    padding: 0.7rem 1.1rem; cursor: pointer;
    background: rgba(40, 35, 31, 0.82); color: var(--paper);
    border: 1px solid rgba(200, 162, 74, 0.45); border-radius: 0.35rem;
    font: inherit; transition: border-color 160ms ease, background 160ms ease;
}
.adv-choice:hover, .adv-choice:focus-visible {
    background: rgba(58, 50, 43, 0.92); border-color: var(--accent);
    outline: none;
}
.adv-choice-primary { font-size: clamp(0.92rem, 2.1vw, 1.05rem); }
.adv-choice-secondary { font-size: 0.8rem; color: rgba(247, 244, 238, 0.66); }

/* 顶栏 */
#bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 7;
    display: flex; align-items: center; gap: 0.4rem;
    padding: 0.55rem clamp(0.6rem, 3vw, 1.4rem);
    background: linear-gradient(to bottom, rgba(14, 12, 11, 0.7), transparent);
    pointer-events: auto;
}
#bar .spacer { flex: 1; }
button.chip {
    font: inherit; font-size: 0.8rem; cursor: pointer;
    padding: 0.35rem 0.8rem; border-radius: 999px;
    background: rgba(30, 26, 23, 0.72); color: rgba(247, 244, 238, 0.86);
    border: 1px solid rgba(255, 255, 255, 0.16);
}
button.chip[aria-pressed="true"] {
    background: var(--accent); color: #201b16; border-color: var(--accent);
}
button.chip:hover { border-color: rgba(200, 162, 74, 0.7); }

/* 开始遮罩：浏览器要一次手势才让声音出来 */
#gate {
    position: absolute; inset: 0; z-index: 20;
    display: grid; place-content: center; justify-items: center; gap: 1.4rem;
    background: #14110f; text-align: center; padding: 2rem;
}
#gate h1 {
    margin: 0; font-size: clamp(1.4rem, 4.6vw, 2.4rem);
    font-weight: 600; letter-spacing: 0.16em;
}
#gate p { margin: 0; max-width: 30rem; line-height: 1.9;
          color: rgba(247, 244, 238, 0.68); font-size: 0.92rem; }
#start {
    font: inherit; font-size: 1rem; cursor: pointer;
    padding: 0.8rem 2.4rem; border-radius: 999px;
    background: var(--accent); color: #201b16; border: none;
    letter-spacing: 0.1em;
}
#start:disabled { opacity: 0.45; cursor: progress; }
#status { font-size: 0.82rem; color: rgba(247, 244, 238, 0.5); min-height: 1.4em; }
</style>
</head>
<body>
<div id="stage">
    <div id="overlay"></div>
    <canvas id="canvas"></canvas>
</div>

<div id="ui">
    <div id="bar">
        <!-- 文字は起動時に i18n の実際のモードから入れる。ここに書くと嘘になる -->
        <button class="chip" id="lang" type="button">言語</button>
        <span class="spacer"></span>
        <button class="chip" id="auto" type="button" aria-pressed="false">自動</button>
        <button class="chip" id="skip" type="button">スキップ</button>
    </div>
</div>

<div id="gate">
    <h1>白紙のエトワリア</h1>
    <p>
        序章「最後の読み手」<br>
        二次創作 / 同人作品。素材は原作より。<br>
        <span style="opacity:.7">点击开始。音声のため、一度クリックが必要です。</span>
    </p>
    <button id="start" type="button" disabled>読みはじめる</button>
    <div id="status">準備中…</div>
</div>

<script type="module" src="./adv.js"></script>
</body>
</html>
