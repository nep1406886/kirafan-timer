<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャラクター確認 / 角色检查</title>
<!--
  Harness for core/actor.js. Proves the four things a game needs from an actor:
  the model loads, the shared class-action clips bind to its skeleton, the
  facial layer table switches expressions, and the weapon lands in the socket.

  Not a game screen -- it exists so a failure shows up here rather than inside
  a battle.
-->
<style>
:root { --bg:#10121a; --panel:#171b26; --line:#2a3040; --text:#e8ebf2; --dim:#8d96ab; --accent:#ffb1cd; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.5 "Segoe UI","Hiragino Sans","Noto Sans CJK SC",sans-serif; }
#app { display:flex; height:100%; }
#stage { position:relative; flex:1 1 auto; min-width:0; background:#0b0e15; }
#stage canvas { display:block; width:100%; height:100%; }
#side { flex:0 0 300px; border-left:1px solid var(--line); background:var(--panel);
    overflow-y:auto; padding:14px; }
h1 { font-size:15px; margin:0 0 12px; }
h1 small { display:block; color:var(--dim); font-weight:400; font-size:11px; }
.group { margin-top:14px; }
.group > label { display:block; color:var(--dim); font-size:11px; margin-bottom:4px;
    letter-spacing:.08em; text-transform:uppercase; }
select { width:100%; background:#0d1017; color:var(--text); border:1px solid var(--line);
    border-radius:4px; padding:6px; }
.chips { display:flex; flex-wrap:wrap; gap:5px; }
.chips button { background:#212736; color:var(--text); border:1px solid var(--line);
    border-radius:4px; padding:5px 9px; cursor:pointer; font-size:12px; }
.chips button:hover { background:#2b3348; }
.chips button.on { background:var(--accent); color:#21151b; border-color:var(--accent); }
.meta { font-size:12px; color:var(--dim); }
.meta div { display:flex; justify-content:space-between; gap:8px; }
.meta b { color:var(--text); font-weight:600; }
.meta .bad b { color:#ff8b8b; }
.meta .ok b { color:#9ee493; }
#status { position:absolute; left:0; right:0; top:0; padding:10px 14px; font-size:12px;
    background:linear-gradient(#0b0e15e0,#0b0e1500); pointer-events:none; }
</style>
</head>
<body>
<div id="app">
    <div id="stage"><div id="status">読み込み中… / 加载中…</div></div>
    <div id="side">
        <h1>キャラクター確認<small>core/actor.js 检查台</small></h1>
        <div class="group">
            <label>キャラ / 角色</label>
            <select id="pick"></select>
        </div>
        <div class="group">
            <label>アクション / 动作</label>
            <div class="chips" id="actions"></div>
        </div>
        <div class="group">
            <label>表情 / 表情</label>
            <div class="chips" id="faces"></div>
        </div>
        <div class="group">
            <label>装備 / 武器</label>
            <div class="chips" id="weapons">
                <button data-w="none">なし</button>
                <button data-w="default" class="on">職業</button>
                <button data-w="dedicated">専用</button>
            </div>
        </div>
        <div class="group">
            <label>状態 / 状态</label>
            <div class="meta" id="stats"></div>
        </div>
    </div>
</div>
<script src="../asset/gacha/cards.js"></script>
<script type="module" src="./actor.js"></script>
</body>
</html>
